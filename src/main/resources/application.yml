# NanoCode Spring Boot 配置
# ============================

spring:
  application:
    name: nanocode

  # 静态资源配置
  web:
    resources:
      static-locations: classpath:/static/
    add-mappings: true

  # Spring MVC 异步请求超时（SSE 需要长连接）
  mvc:
    async:
      request-timeout: 300000   # 5分钟，匹配 SSE_TIMEOUT

# 服务器配置
server:
  port: 8080
  servlet:
    context-path:

# Actuator 配置（健康检查）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# 日志配置（由 logback.xml 控制）
logging:
  level:
    root: INFO
    com.nanocode: DEBUG

# CLI 模式：抑制日志，控制台只留对话
---
spring:
  config:
    activate:
      on-profile: cli
logging:
  level:
    root: WARN
    com.nanocode: WARN
